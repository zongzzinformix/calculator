name: Update Taiwan Bank rates

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'scripts/fetch-rates.mjs'
      - '.github/workflows/update-rates.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch rates
        run: node scripts/fetch-rates.mjs
      - name: Commit rates.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rates.json
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "chore: update Taiwan Bank rates"
            git push
          fi
